[project]
name = "resumatch-ai"
version = "1.0.0"
description = "AI-powered resume analyzer: ATS scoring, keyword gap analysis and LLM rewrites."
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "groq>=0.18.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# main.py lives at the repo root alongside the `app` package; there is no src
# layout, so tell setuptools exactly what to ship instead of auto-discovering
# (which fails when static/, tests/ and sample_data/ sit at the top level).
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "main:app"
